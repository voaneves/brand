<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VOANEVES. email signature</title>
<!-- Copy the table below (not the page) into your mail client's signature editor.
     Email clients ignore web fonts, so stacks fall back to Georgia, Arial and Courier New.
     Replace [email] and the role line. The mark is a hosted PNG (SVG is not supported in Gmail or Outlook). -->
</head>
<body style="margin:0;padding:24px;background:#ffffff;">
<table cellpadding="0" cellspacing="0" border="0" role="presentation" style="border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;color:#0a0a0a;">
  <tr>
    <td valign="top" style="padding:0 16px 0 0;">
      <img src="https://raw.githubusercontent.com/voaneves/brand/main/templates/assets/mark-192.png" width="48" height="48" alt="VOANEVES" style="display:block;border:0;width:48px;height:48px;">
    </td>
    <td valign="top" style="padding:0 0 0 16px;border-left:2px solid #f50000;">
      <div style="font-family:Georgia,'Times New Roman',serif;font-size:20px;line-height:24px;font-weight:bold;font-style:italic;color:#0a0a0a;">Victor Neves</div>
      <div style="font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:20px;color:#5c5446;padding:2px 0 8px 0;">Full stack developer and web designer</div>
      <div style="font-family:'Courier New',Courier,monospace;font-size:12px;line-height:18px;letter-spacing:1px;color:#0a0a0a;">
        <a href="https://voaneves.com" style="color:#b80000;text-decoration:underline;">voaneves.com</a>
        &nbsp;&middot;&nbsp;
        <a href="mailto:[email]" style="color:#b80000;text-decoration:underline;">[email]</a>
      </div>
      <div style="font-family:'Courier New',Courier,monospace;font-size:12px;line-height:18px;letter-spacing:1px;padding-top:2px;">
        <a href="https://github.com/voaneves" style="color:#b80000;text-decoration:underline;">github.com/voaneves</a>
      </div>
    </td>
  </tr>
</table>
</body>
</html>
