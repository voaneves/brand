<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VOANEVES. Open Graph image (1200x630)</title>
<!-- Edit the text, then export 1200x630 (see README). Fonts load from ../fonts/ when opened from the repo. -->
<style>
  @font-face { font-family: "Fraunces"; src: url("../fonts/fraunces-roman.woff2") format("woff2"); font-weight: 100 900; font-style: normal; }
  @font-face { font-family: "Fraunces"; src: url("../fonts/fraunces-italic-display.woff2") format("woff2"); font-weight: 100 900; font-style: italic; }
  @font-face { font-family: "JetBrains Mono"; src: url("../fonts/jetbrains-mono.woff2") format("woff2"); font-weight: 100 800; }
  @font-face { font-family: "Schibsted Grotesk"; src: url("../fonts/schibsted-grotesk.woff2") format("woff2"); font-weight: 400 900; }
  :root { --ink: #0a0a0a; --cream: #f4ead4; --signal: #f50000; --sand: #a69c86; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; background: var(--ink); }
  .card { width: 1200px; height: 630px; padding: 72px 80px; display: flex; flex-direction: column; justify-content: space-between; background: var(--ink); color: var(--cream); overflow: hidden; }
  .top { display: flex; align-items: center; gap: 20px; }
  .top img { width: 64px; height: 64px; }
  .wordmark { font: 700 28px/1 "JetBrains Mono", monospace; letter-spacing: .1em; }
  .wordmark b { color: var(--signal); font-weight: 700; }
  .tag { font: 500 20px/1 "JetBrains Mono", monospace; letter-spacing: .2em; text-transform: uppercase; color: var(--sand); margin-bottom: 28px; }
  h1 { font: italic 900 108px/.95 "Fraunces", Georgia, serif; letter-spacing: -.03em; font-variation-settings: "opsz" 144; max-width: 1000px; }
  .foot { display: flex; justify-content: space-between; font: 500 22px/1 "JetBrains Mono", monospace; letter-spacing: .12em; text-transform: uppercase; color: var(--sand); }
  .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: var(--signal); margin-right: 14px; }
</style>
</head>
<body>
<main class="card">
  <div class="top">
    <img src="assets/mark-reverse-192.png" alt="" width="64" height="64">
    <span class="wordmark">VOANEVES<b>.</b></span>
  </div>
  <div>
    <p class="tag">01 / Page label</p>
    <h1>One clear signal, set large.</h1>
  </div>
  <div class="foot"><span><i class="dot"></i>voaneves.com</span><span>Victor Neves</span></div>
</main>
</body>
</html>
