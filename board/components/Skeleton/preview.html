<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skeleton — voaneves brand board</title>
  <link rel="stylesheet" href="../../../dist/css/all.css" />
</head>
<body>
  <main class="vn-section vn-container" style="display:grid;gap:24px;max-width:640px;">
    <section aria-busy="true" aria-label="Carregando projetos">
      <p role="status" class="vn-type-caption">Carregando projetos…</p>
      <div style="display:flex;gap:16px;align-items:center;">
        <span class="vn-skeleton vn-skeleton--circle" aria-hidden="true"></span>
        <div style="flex:1;"><span class="vn-skeleton vn-skeleton--text" aria-hidden="true"></span><span class="vn-skeleton vn-skeleton--text" style="width:60%;" aria-hidden="true"></span></div>
      </div>
      <span class="vn-skeleton vn-skeleton--block" aria-hidden="true"></span>
    </section>
  </main>
</body>
</html>
