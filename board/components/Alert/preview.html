<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alert — voaneves brand board</title>
  <link rel="stylesheet" href="../../../dist/css/all.css" />
</head>
<body>
  <main class="vn-section vn-container" style="display:grid;gap:16px;max-width:640px;">
    <div class="vn-alert" role="status">
      <p class="vn-alert__title">Mensagem enviada</p>
      <p class="vn-alert__body">Respondo em até 1 dia útil.</p>
    </div>
    <div class="vn-alert vn-alert--error" role="alert">
      <p class="vn-alert__title">Não foi possível enviar</p>
      <p class="vn-alert__body">Tente de novo em instantes.</p>
      <button class="vn-icon-btn vn-alert__close" type="button" aria-label="Fechar aviso">×</button>
    </div>
  </main>
</body>
</html>
