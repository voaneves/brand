<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Radio — voaneves brand board</title>
  <link rel="stylesheet" href="../../../dist/css/all.css" />
</head>
<body>
  <main class="vn-section vn-container">
    <fieldset class="vn-fieldset">
      <legend>Prazo</legend>
      <label class="vn-check"><input class="vn-check__input" type="radio" name="p" checked /><span class="vn-check__label">Até 2 semanas</span></label>
      <label class="vn-check"><input class="vn-check__input" type="radio" name="p" /><span class="vn-check__label">Até 1 mês</span></label>
      <label class="vn-check"><input class="vn-check__input" type="radio" name="p" disabled /><span class="vn-check__label">Sem prazo (indisponível)</span></label>
    </fieldset>
  </main>
</body>
</html>
