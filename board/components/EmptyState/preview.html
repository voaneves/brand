<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Empty state — voaneves brand board</title>
  <link rel="stylesheet" href="../../../dist/css/all.css" />
</head>
<body>
  <main class="vn-section vn-container" style="display:grid;gap:24px;max-width:640px;">
    <section class="vn-empty" aria-labelledby="e-t">
      <h2 class="vn-empty__title" id="e-t">Nenhum projeto ainda.</h2>
      <p class="vn-empty__body">Quando você criar o primeiro, ele aparece aqui.</p>
      <div class="vn-empty__actions">
        <button class="vn-btn vn-btn--primary vn-btn--md" type="button">Criar o primeiro projeto</button>
        <button class="vn-btn vn-btn--ghost vn-btn--md" type="button">Saiba mais</button>
      </div>
    </section>
  </main>
</body>
</html>
