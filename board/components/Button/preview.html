<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Button — voaneves brand board</title>
  <link rel="stylesheet" href="../../../dist/css/all.css" />
</head>
<body>
  <main class="vn-section vn-container" style="display:flex;flex-wrap:wrap;gap:16px;align-items:center;">
    <button class="vn-btn vn-btn--primary vn-btn--md" type="button"><span class="vn-btn__dot" aria-hidden="true"></span>Primário</button>
    <button class="vn-btn vn-btn--signal vn-btn--md" type="button"><span class="vn-btn__dot" aria-hidden="true"></span>Sinal</button>
    <button class="vn-btn vn-btn--secondary vn-btn--md" type="button">Secundário</button>
    <button class="vn-btn vn-btn--ghost vn-btn--sm" type="button">Ghost</button>
    <button class="vn-btn vn-btn--primary vn-btn--lg" type="button" disabled>Desativado</button>
  </main>
</body>
</html>
