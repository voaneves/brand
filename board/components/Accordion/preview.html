<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Accordion — voaneves brand board</title>
  <link rel="stylesheet" href="../../../dist/css/all.css" />
</head>
<body>
  <main class="vn-section vn-container" style="display:grid;gap:24px;max-width:640px;">
    <div class="vn-accordion">
      <details class="vn-accordion__item" open>
        <summary class="vn-accordion__summary">Quanto custa um site?</summary>
        <div class="vn-accordion__panel"><p>A partir de R$ 800, com domínio e hospedagem.</p></div>
      </details>
      <details class="vn-accordion__item">
        <summary class="vn-accordion__summary">Em quanto tempo você responde?</summary>
        <div class="vn-accordion__panel"><p>Respondo em até 1 dia útil.</p></div>
      </details>
    </div>
  </main>
</body>
</html>
