<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NavBar — voaneves brand board</title>
  <link rel="stylesheet" href="../../../dist/css/all.css" />
</head>
<body>
  <a class="vn-skip-link" href="#main">Pular para o conteúdo</a>
  <header class="vn-navbar">
    <div class="vn-container vn-navbar__inner">
      <a class="vn-navbar__brand vn-type-wordmark" href="#top">voaneves</a>
      <nav class="vn-navbar__nav" aria-label="Principal">
        <a class="vn-type-label" href="#work">Projetos</a>
        <a class="vn-type-label" href="#services">Serviços</a>
        <a class="vn-type-label" href="#about">Sobre</a>
      </nav>
      <div class="vn-navbar__actions">
        <a class="vn-btn vn-btn--primary vn-btn--sm" href="#contact"><span class="vn-btn__dot" aria-hidden="true"></span>Contato</a>
        <button class="vn-btn vn-btn--secondary vn-btn--sm vn-navbar__menu" type="button" id="menu"
                data-drawer-open aria-controls="drawer" aria-expanded="false">Menu</button>
      </div>
    </div>
  </header>
  <!-- The drawer sits outside the header: backdrop-filter on the navbar would otherwise become its containing block. -->
  <aside class="vn-drawer" id="drawer" aria-label="Menu" hidden>
    <button class="vn-icon-btn" type="button" data-drawer-close data-drawer-autofocus aria-label="Fechar menu">×</button>
    <nav aria-label="Menu móvel">
      <a class="vn-drawer__link vn-type-label" href="#work">Projetos <span aria-hidden="true">→</span></a>
      <a class="vn-drawer__link vn-type-label" href="#services">Serviços <span aria-hidden="true">→</span></a>
      <a class="vn-drawer__link vn-type-label" href="#about">Sobre <span aria-hidden="true">→</span></a>
    </nav>
  </aside>
  <main id="main" class="vn-section vn-container"><p>Conteúdo da página.</p></main>
  <script type="module">
    import { initDrawer } from '../../../dist/js/drawer.js';
    initDrawer();
    if (location.hash === '#open') document.getElementById('menu').click();
  </script>
</body>
</html>
