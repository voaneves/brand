<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Table — voaneves brand board</title>
  <link rel="stylesheet" href="../../../dist/css/all.css" />
</head>
<body>
  <main class="vn-section vn-container">
    <div class="vn-table-wrap" role="region" aria-labelledby="cap" tabindex="0">
      <table class="vn-table">
        <caption id="cap">Horas por projeto, 2026</caption>
        <thead>
          <tr>
            <th scope="col" aria-sort="ascending"><button type="button">Projeto</button></th>
            <th scope="col" class="vn-table__num" aria-sort="none"><button type="button">Horas</button></th>
            <th scope="col" class="vn-table__num">Receita</th>
          </tr>
        </thead>
        <tbody>
          <tr><th scope="row">Dashboard BI</th><td class="vn-table__num">55</td><td class="vn-table__num">R$ 11.000,00</td></tr>
          <tr><th scope="row">Design system</th><td class="vn-table__num">64</td><td class="vn-table__num">R$ 12.160,00</td></tr>
          <tr><th scope="row">Site institucional</th><td class="vn-table__num">42</td><td class="vn-table__num">R$ 7.560,00</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
