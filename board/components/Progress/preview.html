<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Progress — voaneves brand board</title>
  <link rel="stylesheet" href="../../../dist/css/all.css" />
</head>
<body>
  <main class="vn-section vn-container" style="display:grid;gap:24px;max-width:640px;">
    <div>
      <label for="pg" class="vn-type-caption">Enviando arquivos: 60%</label>
      <progress class="vn-progress" id="pg" value="60" max="100">60%</progress>
    </div>
    <div>
      <label for="pg2" class="vn-type-caption">Concluído</label>
      <progress class="vn-progress" id="pg2" value="100" max="100">100%</progress>
    </div>
  </main>
</body>
</html>
