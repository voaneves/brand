name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  conventional-title:
    name: Validate Conventional Commit Title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check PR title format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node -e '
            const title = process.env.PR_TITLE || "";
            const re = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .{3,}$/;
            if (!re.test(title)) {
              console.error("Invalid PR title:", title);
              console.error("Expected Conventional Commit format, e.g.: feat(tokens): add surface-soft alias");
              process.exit(1);
            }
            console.log("Valid PR title:", title);
          '
